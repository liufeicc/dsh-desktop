<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH 正在启动</title>
    <!--
      启动过渡页。
      为什么要它：dsh 服务器冷启动要装配整个 profile（本机实测约 17 秒），
      如果这段时间窗口一片空白，用户会以为程序没反应。
      这里先给一个明确的“正在启动”反馈，服务器就绪后主进程会把窗口切到真正的界面。
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161c;
        color: #e7e9ee;
        font-family: "Ubuntu", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .box {
        text-align: center;
        max-width: 460px;
        padding: 0 24px;
      }
      .logo {
        width: 84px;
        height: 84px;
        opacity: 0.95;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 22px 0 10px;
      }
      p {
        font-size: 13px;
        line-height: 1.7;
        color: #9aa2b1;
        margin: 6px 0;
      }
      .spinner {
        margin: 26px auto 0;
        width: 26px;
        height: 26px;
        border: 3px solid rgba(77, 107, 254, 0.25);
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo" src="./assets/favicon-dark.svg" alt="DSH" />
      <h1>正在启动 DSH 服务器…</h1>
      <p>首次启动需要装配 profile，通常 10~20 秒，请稍候。</p>
      <p>启动完成后，这个窗口会自动切换到对话界面。</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
